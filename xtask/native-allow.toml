graphs = ["fuzz"]
features = ["default", "link_libfuzzer"]
script = "compiles libFuzzer's C++ sources (libfuzzer/*.cpp, C++17) with cc and links them as a static library; honours CUSTOM_LIBFUZZER_PATH instead when set"
reason = "the libFuzzer runtime of GT5 (PLAN §2.2, §2.4): host-only, fuzz workspace only, never in a checked graph; pinned exactly (tools.md §4.1)"

[[package]]
name = "moirai-fuzz"
versions = "=0.0.0"
graphs = ["fuzz"]
features = []
script = "on x86_64-pc-windows-msvc without a sanitizer, compiles src/sancov_sections.c (the SanitizerCoverage section bounds) with cc and passes its object to every binary target's linker; nothing on other targets"
reason = "fallback A of tools.md §4.4: a sanitizer-off fuzz target does not link on MSVC without the bounds; the fuzz package itself, host-only"
