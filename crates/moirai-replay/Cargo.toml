# WP-74: the JSON Lines records of `moirai-tsoracle` (its crate documentation, "Output").
serde_json.workspace = true

[dev-dependencies]
# WP-74: the generated inputs of the differentials.
proptest.workspace = true

[lints]
workspace = true
