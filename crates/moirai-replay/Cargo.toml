# Test-only crate (docs/m0/PLAN.md §2.2). Allowed dependencies: moirai-files, moirai-model; serde_json; dev: proptest
# (PLAN §2.4: property suites in test crates). Filled by WP-74 to WP-77 (R-REPLAY). moirai-model is added by the WP
# that first calls it (WP-76's exact-evidence rows, WP-77's P11 differential): until then it would only lengthen every
# replay build.
[package]
name = "moirai-replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
