# moirai fuzz workspace (docs/m0/PLAN.md §2.2, §6.2 R7; docs/m0/tools.md §4).
#
# A separate Cargo workspace, excluded from the root one: libfuzzer-sys compiles libFuzzer's C++ sources, so nothing
# here may enter a checked graph ([90 §11.1]). It builds only with the nightly pinned in `rust-toolchain.toml` beside
# this file, so `cargo fuzz` runs from this directory; run from the repository root, rustup would pick the root's
# stable pin instead (tools.md §4.2).
#
# FL-1's work packages add one `[[bin]]` entry per target: WP-65 (R-FL1A) `fuzz_targets/{anchor,path,spec}_*.rs`,
# WP-67 (R-FL1B) `fuzz_targets/{scan,ignore,sketch}_*.rs` (docs/m0/authors.md §3). The entry shape is:
#
#   [[bin]]
#   name = "path_spec"
#   path = "fuzz_targets/path_spec.rs"
#   test = false
#   doc = false
#   bench = false
#
# Every target calls `moirai_fuzz::record(data)` first (src/lib.rs); the gate's `fuzz` step refuses one that does not.
# The library is fallback A of tools.md §4.4 for libFuzzer on x86_64-pc-windows-msvc with the sanitizer off: build.rs
# links the SanitizerCoverage section bounds of src/sancov_sections.c into every target, and `record` installs the
# hooks that write a panicking input as libFuzzer's `crash-<sha1>` artifact and an input whose allocation fails as
# `oom-<sha1>`. The library target also lets this manifest resolve before the first fuzz target exists;
# `fuzz/Cargo.lock` is written by the gate worktree and scanned by WP-02's lints (tools.md §4.1).

[package]
name = "moirai-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[lib]
path = "src/lib.rs"

[dependencies]
# Licence "(MIT OR Apache-2.0) AND NCSA": NCSA is allowed in fuzz/Cargo.lock only (PLAN §2.4).
# Exact pin (tools.md §4.1).
libfuzzer-sys = "=0.4.13"
moirai-files = { path = "../crates/moirai-files" }
# The panic-artifact hook names a crashing input `crash-<sha1>`, as libFuzzer does (src/artifact.rs); the same
# requirement and features as the root workspace's entry, so it is the package moirai-files already brings in.
sha1 = { version = "0.11.0", default-features = false }

[build-dependencies]
# Compiles src/sancov_sections.c on MSVC (build.rs). The version libfuzzer-sys's own build dependency resolves to,
# pinned exactly like libfuzzer-sys (tools.md §4.1, §4.4).
cc = "=1.5.1"

[lints.rust]
# PLAN §2.1: no crate but moirai-os contains unsafe code. libfuzzer-sys's `fuzz_target!` compiles under it
# (WP-06 spike, tools.md §4.1).
unsafe_code = "forbid"

[lints.cargo]
# libfuzzer-sys and moirai-files are for the fuzz targets, and the library target uses neither. Until FL-1's first
# target exists (WP-65, WP-67), the pinned nightly's cargo reports both as unused dependencies on every build that
# covers every target, the gate's `fuzz` step among them (tools.md §4.1, §4.7). They stay declared so that
# fuzz/Cargo.lock holds the targets' graph and WP-02's lints scan it before the first target arrives: the NCSA licence
# and libFuzzer's C++ build script. Once a target uses both, cargo stops reporting them (it reports a dependency only
# when the targets it built include every one that could use it), so the work package that adds the first target
# removes this table, and a dependency no target uses warns again. Stable cargo (the gate's `cargo metadata` and
# `cargo fmt` over this manifest) accepts the table and stays silent.
unused_dependencies = "allow"
